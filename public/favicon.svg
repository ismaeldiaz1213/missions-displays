<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Misiones IBL: the world, a flight path out from Houston, and IBL on top -->
  <defs>
    <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="32" cy="32" r="27"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="27" fill="url(#ocean)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.6">
    <ellipse cx="32" cy="32" rx="11" ry="27"/>
    <line x1="32" y1="4" x2="32" y2="60"/>
    <line x1="4" y1="22" x2="60" y2="22"/>
    <line x1="4" y1="42" x2="60" y2="42"/>
  </g>
  <!-- Flight path swinging around the world -->
  <path d="M7 47 C 6 22, 30 3, 55 12" fill="none" stroke="#F59E0B" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="55" cy="12" r="4.2" fill="#F59E0B" stroke="#fff" stroke-width="1.6"/>
  <text x="32" y="38.5" text-anchor="middle" font-family="'Arial Black', 'Adwaita Sans', Arial, sans-serif" font-weight="900" font-size="19" letter-spacing="-0.5" fill="#fff" stroke="#1E3A8A" stroke-width="0.8" paint-order="stroke">IBL</text>
</svg>
